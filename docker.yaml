version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: paccelli-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: paccelli_lanches
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - paccelli_pgdata:/var/lib/postgresql/data

volumes:
  paccelli_pgdata: