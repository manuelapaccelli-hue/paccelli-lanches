<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paccelli Lanches • Cadastro</title>
  <link rel="stylesheet" href="cadastro.css">
  <link rel="stylesheet" href="footer.css">
  <script src="pacceli.js" defer></script>
</head>
<body>

<div class="container">
  <div class="cadastro-container">
    <!-- Cabeçalho -->
    <div class="header">
      <a href="/" class="back-link" aria-label="Voltar para o início"><span class="back-arrow"></span></a>
      <div class="logo">🍔</div>
      <h1>Crie sua conta</h1>
      <p>Peça seus lanches favoritos em minutos!</p>
    </div>

    <!-- Formulário de Cadastro -->
    <div class="form-container">
      <form id="cadastroForm">
        <div class="input-group">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" placeholder="Digite seu nome" required>
        </div>

        <div class="input-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seuemail@email.com" required>
        </div>

        <div class="input-group">
          <label for="telefone">Telefone (WhatsApp)</label>
          <input type="tel" id="telefone" placeholder="(XX) XXXXX-XXXX" required>
        </div>

        <div class="row">
          <div class="input-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14">
          </div>
          <div class="input-group">
            <label for="data-nasc">Data de nascimento</label>
            <input type="date" id="data-nasc">
          </div>
        </div>

        <div class="input-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="Crie uma senha" required>
        </div>

        <div class="input-group">
          <label for="confirmar-senha">Confirmar senha</label>
          <input type="password" id="confirmar-senha" placeholder="Confirme sua senha" required>
        </div>

        <div class="terms">
          Ao criar sua conta, você concorda com nossos
          <a href="#">Termos de Uso</a> e
          <a href="#">Política de Privacidade</a>.
        </div>

        <button type="submit" class="btn-primary">Cadastrar</button>
      </form>

      <div class="login-link">
        Já tem uma conta? <a href="login">Faça login</a>
      </div>
    </div>
  </div>
</div>

{#include footer /}

</body>
</html>
