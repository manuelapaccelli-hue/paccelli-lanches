<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paccelli Lanches • Meu Perfil</title>
    <link rel="stylesheet" href="perfil.css">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="footer.css">
    <script src="perfil.js" defer></script>
</head>
<body>

{#include navbar /}

<div class="container">
    <form class="info-box" id="formPerfil" novalidate>
        <h2>👤 Meu Perfil</h2>
        <p class="subtitulo">Suas informações cadastradas no Paccelli Lanches. Altere o que precisar e salve.</p>

        <label class="perfil-campo">
            <span class="rotulo">Nome completo</span>
            <input type="text" name="nome" value="{perfil.nome}" required>
        </label>

        <label class="perfil-campo">
            <span class="rotulo">E-mail</span>
            <input type="email" name="email" value="{perfil.email}" required>
        </label>

        <label class="perfil-campo">
            <span class="rotulo">Telefone</span>
            <input type="tel" name="telefone" value="{perfil.telefone ?: ''}" placeholder="(XX) XXXXX-XXXX">
        </label>

        <label class="perfil-campo">
            <span class="rotulo">CPF</span>
            <input type="text" name="cpf" value="{perfil.cpf ?: ''}" placeholder="000.000.000-00">
        </label>

        <label class="perfil-campo">
            <span class="rotulo">Data de nascimento</span>
            <input type="date" name="dataNascimento" value="{perfil.dataNascimento ?: ''}">
        </label>

        <p class="mensagem" role="status" hidden></p>
        <button type="submit" class="btn-salvar-perfil">Salvar alterações</button>
    </form>

    <form class="info-box" id="formSenha" novalidate>
        <h3>🔑 Alterar senha</h3>

        <label class="perfil-campo">
            <span class="rotulo">Senha atual</span>
            <input type="password" name="senhaAtual" autocomplete="current-password" required>
        </label>

        <label class="perfil-campo">
            <span class="rotulo">Nova senha</span>
            <input type="password" name="novaSenha" autocomplete="new-password" placeholder="Mínimo de 6 caracteres" required>
        </label>

        <label class="perfil-campo">
            <span class="rotulo">Confirmar nova senha</span>
            <input type="password" name="confirmarSenha" autocomplete="new-password" required>
        </label>

        <p class="mensagem" role="status" hidden></p>
        <button type="submit" class="btn-salvar-perfil">Alterar senha</button>
    </form>

    <button type="button" id="logoutBtn" class="btn-logout">Sair da conta</button>
</div>

{#include footer /}

</body>
</html>
