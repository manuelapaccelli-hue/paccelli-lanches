<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paccelli Lanches • Meu Perfil</title>
    <link rel="stylesheet" href="perfil.css">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="footer.css">
    <script src="pacceli.js" defer></script>
</head>
<body>

{#include navbar /}

<div class="container">
    <div class="info-box" id="perfilBox">
        <h2>👤 Meu Perfil</h2>
        <p class="subtitulo">Suas informações cadastradas no Paccelli Lanches.</p>

        <div class="perfil-campo">
            <span class="rotulo">Nome completo</span>
            <span class="valor" id="perfilNome">—</span>
        </div>

        <div class="perfil-campo">
            <span class="rotulo">E-mail</span>
            <span class="valor" id="perfilEmail">—</span>
        </div>

        <div class="perfil-campo">
            <span class="rotulo">Telefone</span>
            <span class="valor" id="perfilTelefone">—</span>
        </div>

        <div class="perfil-campo">
            <span class="rotulo">CPF</span>
            <span class="valor" id="perfilCpf">—</span>
        </div>

        <div class="perfil-campo">
            <span class="rotulo">Data de nascimento</span>
            <span class="valor" id="perfilDataNascimento">—</span>
        </div>

        <button id="logoutBtn" class="btn-logout">Sair da conta</button>
    </div>
</div>

{#include footer /}

</body>
</html>
