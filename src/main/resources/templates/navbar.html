<!-- HEADER -->
<header>
    <div class="header-content">
        <div class="logo">
            <span class="flame">🔥</span>
            Paccelli <span>Lanches</span>
        </div>

        <nav>
            <a href="/">Início</a>
            <a href="cardapio">Cardápio</a>
            <a href="promocoes">Promoções</a>
            <a href="contato">Contato</a>
            <a id="auditoriaLink" href="auditoria" style="display:none;">Auditoria</a>
            <a id="usuariosLink" href="usuarios" style="display:none;">Usuários</a>
        </nav>

        <div class="header-actions">
            <a href="/carrinho" class="carrinho-link" aria-label="Carrinho" title="Carrinho">🛒</a>
            <a id="authLink" href="/login" class="btn-primary" style="display:inline-block; text-decoration:none; text-align:center;">Entrar</a>
            <button class="hamburger" onclick="toggleMobileMenu()">
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
            </button>
        </div>
    </div>
</header>

<script>
    // Função para abrir WhatsApp
    function openWhatsApp() {
        window.open('https://wa.me/5511987654321?text=Olá! Quero fazer um pedido no Paccelli Lanches 🔥', '_blank');
    }

    // Menu mobile simples
    function toggleMobileMenu() {
        alert("☰ Menu mobile\n\nInício | Cardápio | Promoções | Contato | Carrinho");
    }

    // Alterna o link de "Entrar" / "Perfil" de acordo com a sessão do servidor
    (function() {
        const authLink = document.getElementById('authLink');
        const auditoriaLink = document.getElementById('auditoriaLink');
        const usuariosLink = document.getElementById('usuariosLink');

        fetch('/login/status')
            .then(function(response) { return response.json(); })
            .then(function(status) {
                if (authLink) {
                    if (status.logado) {
                        authLink.textContent = 'Perfil';
                        authLink.href = '/perfil';
                    } else {
                        authLink.textContent = 'Entrar';
                        authLink.href = '/login';
                    }
                }
                if (auditoriaLink) {
                    auditoriaLink.style.display = status.admin ? 'inline-block' : 'none';
                }
                if (usuariosLink) {
                    usuariosLink.style.display = status.admin ? 'inline-block' : 'none';
                }
            })
            .catch(function() {
                if (authLink) {
                    authLink.textContent = 'Entrar';
                    authLink.href = '/login';
                }
            });
    })();
</script>
